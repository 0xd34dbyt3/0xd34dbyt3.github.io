name: Static Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-pages.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: node --test scripts/tests/*.test.cjs
      - run: python scripts/check_repository_sources.py
      - run: python scripts/build_pages.py --release --refresh-feeds --output dist/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    # Publication explicitly authorized; OAuth is independent of the visitor site.
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
