    <script type="module">
        import DataManager from './js/data-manager.js';
        import './script.js?v=4';

        const container = document.getElementById('projectsContainer');

        const DEFAULT_PROJECTS = [
            { id: 1, title: 'Paranoid_Osint_Tool', shortDesc: 'A comprehensive OSINT tool for gathering intelligence from public sources.' },
            { id: 2, title: 'Neural_Network_Firewall', shortDesc: 'AI-driven firewall system that adapts to new threat patterns in real-time.' },
            { id: 3, title: 'Ghost_Shell_V2', shortDesc: 'Encrypted reverse shell written in Rust with anti-forensic capabilities.' }
        ];

        async function loadProjects() {
            let projects = await DataManager.getProjects('project');
            if (!projects || projects.length === 0) {
                projects = DEFAULT_PROJECTS;
            }

            container.replaceChildren();

            projects.forEach(project => {
                const card = document.createElement('a');
                card.href = `detail.html?type=project&id=${encodeURIComponent(project.id)}`;
                card.className = 'nav-box project-card';

                const title = document.createElement('div');
                title.className = 'box-text glitch-text';
                title.style.fontSize = '1.15rem';
                title.style.color = 'var(--accent-color)';
                title.style.marginBottom = '0.5rem';
                title.textContent = project.title || 'Untitled Project';

                const desc = document.createElement('div');
                desc.style.color = 'var(--text-muted)';
                desc.style.fontSize = '0.9rem';
                desc.style.lineHeight = '1.4';
                desc.textContent = project.shortDesc || '';

                card.appendChild(title);
                card.appendChild(desc);
                container.appendChild(card);
            });
        }

        loadProjects().then(() => {
            window.dispatchEvent(new Event('contentUpdated'));
        });
    </script>
