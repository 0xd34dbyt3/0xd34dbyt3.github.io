    <script type="module">
        import DataManager from './js/data-manager.js';
        import './script.js?v=4';

        const SAMPLE_DETAILS = {
            '1': { title: 'Paranoid_Osint_Tool', fullDesc: '# Paranoid OSINT Tool\n\nA powerful command-line interface tool designed for security researchers to automate open-source intelligence gathering.\n\n## Features\n- Subdomain enumeration\n- Email harvesting\n- Port scanning integration\n\n```bash\npython Paranoid.py -t example.com\n```' },
            '2': { title: 'Neural_Network_Firewall', fullDesc: '# Neural Network Firewall\n\nUnlike traditional firewalls, this system uses a trained LSTM model to detect anomalies in packet headers in real-time.\n\n### Tech Stack\n- Python / PyTorch\n- iptables binding\n- Real-time logging' },
            '3': { title: 'Ghost_Shell_V2', fullDesc: '# Ghost Shell V2\n\n**Educational Purpose Only**\n\nA proof-of-concept reverse shell demonstrating memory evasion techniques written in Rust.\n\n- Zero-dependency\n- AES-256 Command Encryption' },
            '4': { title: 'The_Art_of_Evasion', fullDesc: "# The Art of Evasion\n\nEDR solutions have evolved, but so have attack techniques. In this article, we explore how syscall hooking can be circumvented using direct system calls.\n\n## Direct Syscalls\n\nUsing Hell's Gate technique to resolve syscall numbers dynamically..." },
            '5': { title: 'AI_Red_Teaming', fullDesc: '# AI Red Teaming\n\nLarge Language Models are vulnerable to prompt injection and adversarial attacks. We discuss jailbreak methodologies and safety boundary testing.' }
        };

        async function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            const id = params.get('id');
            const backLink = document.getElementById('backLink');

            let item = null;

            if (type === 'project' && id) {
                item = await DataManager.getProjectById(id);
                backLink.href = 'projects.html';
                backLink.textContent = '< ./projects.exe';
            } else if (type === 'blog' && id) {
                item = await DataManager.getBlogById(id);
                backLink.href = 'blog.html';
                backLink.textContent = '< ./blog.txt';
            }

            if (!item || item.error) {
                if (id && SAMPLE_DETAILS[id]) {
                    item = SAMPLE_DETAILS[id];
                }
            }

            const pageTitle = document.getElementById('pageTitle');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const contentArea = document.getElementById('contentArea');
            contentArea.replaceChildren();

            if (item && !item.error) {
                pageTitle.textContent = item.title || 'Untitled';
                pageSubtitle.textContent = 'READ_MODE: ENABLED';

                if (item.image) {
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.title || 'Detail image';
                    img.className = 'detail-image';
                    contentArea.appendChild(img);
                }

                const bodyDiv = document.createElement('div');
                const textContent = item.fullDesc || item.shortDesc || '';
                if (window.marked && typeof window.marked.parse === 'function') {
                    let parsedHtml = window.marked.parse(textContent);
                    parsedHtml = parsedHtml.replace(/<img\s+src="([^"]+)"\s+alt="([^"|]*)\|?([^"]*)"/g, (match, src, altText, size) => {
                        let styleAttr = 'max-width:100%; height:auto; display:block; margin:1.25rem auto; border-radius:6px; border:1px solid var(--border-color);';
                        if (size) {
                            const cleanSize = size.trim();
                            if (cleanSize) {
                                const w = (cleanSize.endsWith('%') || cleanSize.endsWith('px')) ? cleanSize : cleanSize + 'px';
                                styleAttr = `width:${w}; max-width:100%; height:auto; display:block; margin:1.25rem auto; border-radius:6px; border:1px solid var(--border-color);`;
                            }
                        }
                        return `<img src="${src}" alt="${altText}" style="${styleAttr}"`;
                    });
                    bodyDiv.className = 'markdown-content';
                    bodyDiv.innerHTML = parsedHtml;
                } else {
                    bodyDiv.textContent = textContent;
                }
                contentArea.appendChild(bodyDiv);
            } else {
                pageTitle.textContent = '404_NOT_FOUND';
                pageSubtitle.textContent = 'The requested resource could not be located.';
            }
        }

        loadDetail().then(() => {
            window.dispatchEvent(new Event('contentUpdated'));
        });
    </script>
